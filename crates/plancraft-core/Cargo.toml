[package]
name = "plancraft-core"
description = "PlanCraft project model, calendar math, scheduling engine and workload analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Printing: font metrics, the bundled UI font (embedded in PDFs), PDF stream compression. All pure Rust.
skrifa = "0.44"
epaint_default_fonts = "0.36"
miniz_oxide = "0.8"
# Microsoft Project XML (MSPDI) import and export. Pure Rust; entities in a DOCTYPE are never expanded.
quick-xml = { version = "0.41", default-features = false }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
