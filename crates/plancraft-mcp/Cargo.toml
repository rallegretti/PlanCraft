[package]
name = "plancraft-mcp"
description = "Model Context Protocol (MCP) server exposing PlanCraft projects to AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "plancraft-mcp"
path = "src/main.rs"

[dependencies]
plancraft-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Pure Rust: the app proves to `--attach` that it knows the session token.
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
