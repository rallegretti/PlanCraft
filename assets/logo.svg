  <rect x="0" y="0" width="100" height="100" rx="22" fill="#1B3A8C"/>
  <!-- Dependency elbows -->
  <g stroke="#FFFFFF" stroke-opacity="0.67" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M53 28.5 H58 V44.5"/>
